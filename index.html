<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FocusList — a simple frontend-only to-do app to plan and manage your daily tasks." />
  <title>FocusList — Daily Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <h1 class="brand-name">FocusList</h1>
        </div>
        <p class="today" id="todayLabel"></p>
      </div>
      <p class="tagline">Plan your day. Get things done.</p>
    </header>

    <main>
      <section class="stats" aria-label="Task statistics">
        <div class="stat-card">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statCompleted">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </section>

      <section class="add-task" aria-label="Add a new task">
        <form id="addForm" class="add-form">
          <div class="add-inputs">
            <input
              type="text"
              id="taskInput"
              placeholder="What needs to be done?"
              autocomplete="off"
              maxlength="120"
              aria-label="Task title"
            />
            <select id="prioritySelect" aria-label="Task priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
      </section>

      <section class="controls" aria-label="Search and filters">
        <div class="control-row">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="searchInput" placeholder="Search tasks..." autocomplete="off" aria-label="Search tasks" />
          </div>
          <button id="clearFilters" class="btn btn-ghost" type="button">Clear filters</button>
        </div>
        <div class="control-row">
          <div class="filter-group" role="group" aria-label="Task status filter">
            <button class="chip active" data-status="all">All</button>
            <button class="chip" data-status="active">Active</button>
            <button class="chip" data-status="completed">Completed</button>
          </div>
          <div class="filter-group" role="group" aria-label="Priority filter">
            <button class="chip chip-p" data-priority="all">All</button>
            <button class="chip chip-p" data-priority="high">High</button>
            <button class="chip chip-p" data-priority="medium">Medium</button>
            <button class="chip chip-p" data-priority="low">Low</button>
          </div>
        </div>
      </section>

      <section class="task-list-wrap" aria-label="Task list">
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyState" class="empty-state" hidden>
          <p class="empty-title" id="emptyTitle">No tasks yet</p>
          <p class="empty-sub" id="emptySub">Add your first task above to get started.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>FocusList · Tasks are saved locally in your browser.</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
